[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fx-market-intelligence"
version = "0.1.0"
description = "Auditable FX market intelligence and macroeconomic analytics"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = ["PyYAML>=6,<7", "httpx>=0.28,<1", "python-dotenv>=1,<2", "duckdb>=1.3,<2", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.12,<1", "pre-commit>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
